<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f8">
<title>Medicamentos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<style>
/* Una sola columna para usar con el pulgar: buscador fijo arriba, lista abajo, ficha a pantalla completa. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --text: #1c2733; --muted: #5d6b7a; --line: #dfe5eb;
  --accent: #0b6b7c; --ok: #1f8a57; --warn-bg: #fdf0c8; --warn-text: #7a5300;
  --info-bg: #e3f1f4; --info-text: #0b5766; --error: #b91c1c; --error-bg: #fee2e2;
  --font: system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12181e; --surface: #1b232b; --text: #e8edf2; --muted: #a0adba; --line: #2e3945;
    --accent: #62c6d8; --ok: #52c78d; --warn-bg: #4a3a0c; --warn-text: #ffdc85;
    --info-bg: #17343b; --info-text: #a6e2ee; --error: #fecaca; --error-bg: #4c1d1d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.4; }
.envoltura { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
.cabeza { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 12px 10px; }
h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.2; }
.caja { position: relative; }
#busca, #clave { width: 100%; height: 52px; padding: 0 46px 0 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: 18px; }
#busca::placeholder { color: var(--muted); }
#busca:focus-visible, #clave:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
#limpiar { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
#cuenta { margin: 8px 0 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
#lista { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#lista li + li { border-top: 1px solid var(--line); }
.fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; min-height: 64px; padding: 10px 14px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.fila:active { background: var(--bg); }
.nombre { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
.detalle { grid-column: 1; color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere; }
.estado { grid-column: 2; grid-row: 1 / span 2; }
.marca { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.marca.vigente { padding-inline: 0; color: var(--muted); font-weight: 500; }
.marca.vigente::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.marca.por { background: var(--warn-bg); color: var(--warn-text); }
.marca.sin { padding-inline: 0; color: var(--muted); font-weight: 500; }
.marca.vencido { background: var(--error-bg); color: var(--error); }
#resumen { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.grupo { padding: 10px 14px; border-radius: 10px; }
.grupo.vencido { background: var(--error-bg); color: var(--error); }
.grupo.por { background: var(--warn-bg); color: var(--warn-text); }
.grupo strong { display: block; margin-bottom: 2px; }
.grupo button { display: block; width: 100%; min-height: 40px; padding: 6px 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; text-decoration: underline; cursor: pointer; overflow-wrap: anywhere; }
#vacio { padding: 28px 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; }
#volver { min-height: 48px; margin: 8px 0 4px -8px; padding: 0 8px; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
.ficha h2 { margin: 0 0 8px; font-size: 27px; line-height: 1.2; overflow-wrap: anywhere; }
.ficha dl { display: flex; flex-direction: column; margin: 18px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.dato { padding: 12px 14px; }
.dato + .dato { border-top: 1px solid var(--line); }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 2px 0 0; font-size: 18px; overflow-wrap: anywhere; }
dd.falta { color: var(--muted); font-size: 16px; }
.entrada { padding-block: 40px 0; display: flex; flex-direction: column; gap: 12px; }
.entrada p { margin: 0; color: var(--muted); }
.entrada label { font-size: 15px; font-weight: 600; }
#entrar { height: 52px; border: 0; border-radius: 10px; background: var(--accent); color: var(--bg); font: inherit; font-size: 18px; font-weight: 650; cursor: pointer; }
#entrar:disabled { opacity: .6; }
#error { color: var(--error); font-weight: 600; }
#aviso { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; background: var(--info-bg); color: var(--info-text); font-size: 14px; }
</style>
</head>
<body>
<div class="envoltura">
  <p id="aviso" hidden></p>

  <form id="vistaEntrada" class="entrada" hidden>
    <h1>Medicamentos en casa</h1>
    <p>Escribe la contraseña una vez. Este celular la recordará.</p>
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button id="entrar" type="submit">Entrar</button>
    <p id="error" role="alert" hidden></p>
  </form>

  <section id="vistaLista" hidden>
    <div class="cabeza">
      <h1>Medicamentos en casa</h1>
      <div class="caja">
        <input id="busca" type="search" placeholder="Busca por nombre o compuesto" aria-label="Buscar medicamento" autocomplete="off">
        <button id="limpiar" type="button" aria-label="Borrar búsqueda" hidden>×</button>
      </div>
      <p id="cuenta" aria-live="polite"></p>
    </div>
    <div id="resumen"></div>
    <ul id="lista"></ul>
    <p id="vacio" hidden></p>
  </section>

  <section id="vistaFicha" class="ficha" hidden>
    <button id="volver" type="button">← Volver a la búsqueda</button>
    <h2 id="fNombre"></h2>
    <div id="fEstado"></div>
    <dl id="fDatos"></dl>
  </section>
</div>

<script>
const DIAS_AVISO = 30;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ARCHIVO = 'inventario.json';
let cifrado = null, inventario = [], cambio = '', posicionLista = 0;

const $ = id => document.getElementById(id);
const sinAcentos = t => t.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const fechaLocal = t => { const [a, m, d] = t.split('-').map(Number); return new Date(a, m - 1, d); };
const fmtCad = t => { const f = fechaLocal(t); return `${MESES[f.getMonth()]} de ${f.getFullYear()}`; };
const deBase64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));

function estado(m) {
  if (!m.caducidad) return { clave: 'sin', texto: 'Sin caducidad' };
  const h = new Date(), hoy = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  const dias = Math.round((fechaLocal(m.caducidad) - hoy) / 864e5);
  if (dias < 0) return { clave: 'vencido', texto: 'Vencido' };
  if (dias === 0) return { clave: 'por', texto: 'Vence hoy' };
  if (dias === 1) return { clave: 'por', texto: 'Vence mañana' };
  if (dias <= DIAS_AVISO) return { clave: 'por', texto: `Faltan ${dias} días` };
  return { clave: 'vigente', texto: 'Vigente' };
}

// ---- Llave: se deriva de la contraseña y se guarda en este celular sin poder extraerse ----
const abrirBase = () => new Promise((ok, mal) => {
  const r = indexedDB.open('medicamentos', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('llaves');
  r.onsuccess = () => ok(r.result);
  r.onerror = () => mal(r.error);
});
async function leerLlave() {
  try {
    const db = await abrirBase();
    return await new Promise((ok, mal) => {
      const r = db.transaction('llaves').objectStore('llaves').get('inventario');
      r.onsuccess = () => ok(r.result || null);
      r.onerror = () => mal(r.error);
    });
  } catch (e) { return null; }
}
async function guardarLlave(llave, sal) {
  try {
    const db = await abrirBase();
    db.transaction('llaves', 'readwrite').objectStore('llaves').put({ llave, sal }, 'inventario');
  } catch (e) {}   // sin almacenamiento, la contraseña se pedirá la próxima vez
}
async function derivar(contrasena) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(contrasena), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: deBase64(cifrado.sal), iterations: cifrado.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function descifrar(llave) {
  const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deBase64(cifrado.iv) }, llave, deBase64(cifrado.datos));
  const d = JSON.parse(new TextDecoder().decode(claro));
  inventario = d.inventario;
  cambio = d.cambio;
}

// ---- Pantallas ----
function mostrar(vista) {
  ['vistaEntrada', 'vistaLista', 'vistaFicha'].forEach(v => { $(v).hidden = v !== vista; });
}
const marca = m => {
  const e = estado(m), s = document.createElement('span');
  s.className = `marca ${e.clave}`;
  s.textContent = e.texto;
  return s;
};
function textoCambio() {
  if (!cambio) return '';
  const f = new Date(cambio);
  const hora = `${f.getHours() % 12 || 12}:${String(f.getMinutes()).padStart(2, '0')} ${f.getHours() < 12 ? 'a.m.' : 'p.m.'}`;
  return `Actualizado el ${f.getDate()} de ${MESES[f.getMonth()]}, ${hora}`;
}

function grupoResumen(clave, titulo, meds) {
  const g = document.createElement('div'), t = document.createElement('strong');
  g.className = `grupo ${clave}`;
  t.textContent = titulo;
  g.append(t, ...meds.map(m => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `${m.nombre} · ${clave === 'vencido' ? `venció en ${fmtCad(m.caducidad)}` : estado(m).texto.toLowerCase()}`;
    b.addEventListener('click', () => abrirFicha(m));
    return b;
  }));
  return g;
}

function pintarResumen(meds) {
  // Se calcula con la fecha del celular: un medicamento puede vencer sin que la computadora publique nada.
  const vencidos = meds.filter(m => estado(m).clave === 'vencido');
  const porVencer = meds.filter(m => estado(m).clave === 'por');
  const grupos = [];
  if (vencidos.length) grupos.push(grupoResumen('vencido', vencidos.length === 1 ? '1 vencido' : `${vencidos.length} vencidos`, vencidos));
  if (porVencer.length) grupos.push(grupoResumen('por', porVencer.length === 1 ? '1 por vencer' : `${porVencer.length} por vencer`, porVencer));
  $('resumen').replaceChildren(...grupos);
}

function pintarLista() {
  const todos = [...inventario].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const q = sinAcentos($('busca').value.trim());
  const hallados = todos.filter(m => sinAcentos(`${m.nombre} ${m.compuesto}`).includes(q));
  $('limpiar').hidden = !$('busca').value;
  $('cuenta').textContent = q ? `${hallados.length} de ${todos.length} medicamentos` : `${todos.length} medicamentos · ${textoCambio()}`;
  pintarResumen(q ? [] : todos);
  $('lista').replaceChildren(...hallados.map(m => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button';
    b.className = 'fila';
    const n = document.createElement('span'), d = document.createElement('span'), e = document.createElement('span');
    n.className = 'nombre'; n.textContent = m.nombre;
    d.className = 'detalle'; d.textContent = [m.compuesto, m.gramaje].filter(Boolean).join(' · ') || m.tipo;
    e.className = 'estado'; e.append(marca(m));
    b.append(n, e, d);
    b.addEventListener('click', () => abrirFicha(m));
    li.append(b);
    return li;
  }));
  $('lista').hidden = !hallados.length;
  $('vacio').hidden = !!hallados.length;
  $('vacio').textContent = `No hay medicamentos con «${$('busca').value.trim()}». Revisa cómo está escrito o prueba con el compuesto.`;
}

function abrirFicha(m) {
  $('fNombre').textContent = m.nombre;
  $('fEstado').replaceChildren(marca(m));
  const datos = [['Compuesto', m.compuesto], ['Gramaje', m.gramaje], ['Tipo', m.tipo], ['Contenido', m.cantidad],
    ['Caducidad', m.caducidad ? fmtCad(m.caducidad) : ''], ['Número de cajas', String(m.cajas || '')]];
  $('fDatos').replaceChildren(...datos.map(([et, val]) => {
    const fila = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
    fila.className = 'dato';
    dt.textContent = et;
    dd.textContent = val || 'No indicado';
    if (!val) dd.className = 'falta';
    fila.append(dt, dd);
    return fila;
  }));
  posicionLista = window.scrollY;
  history.pushState({ ficha: true }, '');   // para que el botón Atrás del celular regrese a la lista
  mostrar('vistaFicha');
  window.scrollTo(0, 0);
}

// ---- Arranque ----
function avisar(texto) {
  $('aviso').textContent = texto;
  $('aviso').hidden = !texto;
}
async function iniciar() {
  try {
    const r = await fetch(`${ARCHIVO}?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error();
    cifrado = await r.json();
  } catch (e) {
    avisar('No se pudo cargar el inventario. Conéctate a internet y vuelve a abrir la app.');
    return;
  }
  if (!navigator.onLine) avisar('Sin internet: estás viendo la última copia guardada en este celular.');
  const guardada = await leerLlave();
  if (guardada && guardada.sal === cifrado.sal) {
    try {
      await descifrar(guardada.llave);
      pintarLista();
      mostrar('vistaLista');
      return;
    } catch (e) {}
  }
  mostrar('vistaEntrada');
}

$('vistaEntrada').addEventListener('submit', async e => {
  e.preventDefault();
  $('error').hidden = true;
  $('entrar').disabled = true;
  try {
    const llave = await derivar($('clave').value);
    await descifrar(llave);
    await guardarLlave(llave, cifrado.sal);
    $('clave').value = '';
    pintarLista();
    mostrar('vistaLista');
  } catch (err) {
    $('error').textContent = 'Esa contraseña no es correcta. Revísala y vuelve a intentarlo.';
    $('error').hidden = false;
  }
  $('entrar').disabled = false;
});
$('busca').addEventListener('input', pintarLista);
$('limpiar').addEventListener('click', () => { $('busca').value = ''; pintarLista(); $('busca').focus(); });
$('volver').addEventListener('click', () => history.back());
window.addEventListener('popstate', () => {
  if (!inventario.length) return;
  mostrar('vistaLista');
  window.scrollTo(0, posicionLista);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('vistaLista').hidden) pintarLista(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
</body>
</html>
